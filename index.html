<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>SpaceGravure</title>
    <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline';">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="main-container">
      <!-- Panneau de Gauche (Contrôles) -->
      <div class="left-panel panel">
        <h2>Contrôles</h2>

        <div id="shape-selector">
          <label class="radio-label"><input type="radio" name="shape" value="rectangle" checked> Rectangle</label>
          <label class="radio-label"><input type="radio" name="shape" value="circle"> Cercle</label>
        </div>

        <hr>

        <!-- Paramètres pour le rectangle -->
        <div id="rectangle-params">
          <label for="width">Largeur (mm):</label>
          <input type="number" id="width" value="50">

          <label for="height">Hauteur (mm):</label>
          <input type="number" id="height" value="50">
        </div>

        <!-- Paramètres pour le cercle (cachés par défaut) -->
        <div id="circle-params" style="display: none;">
          <label for="diameter">Diamètre (mm):</label>
          <input type="number" id="diameter" value="50">
        </div>

        <hr>

        <h3>Paramètres Communs</h3>
        <label for="feedRate">Vitesse (mm/min):</label>
        <input type="number" id="feedRate" value="1000">

        <label for="laserPower">Puissance (S-value):</label>
        <input type="number" id="laserPower" value="1000">

        <button id="add-shape-btn" title="Ajoute la forme actuelle à la liste du projet">Ajouter la forme</button>
        <hr>
        <button id="export-gcode-btn" title="Génère le G-code pour toutes les formes du projet">Exporter le G-code final</button>
      </div>

      <!-- Panneau Central (Zone de Travail) -->
      <div class="center-panel panel">
        <canvas id="preview-canvas" width="600" height="600"></canvas>
      </div>

      <!-- Panneau de Droite (Calques/Couches) -->
      <div class="right-panel panel">
        <h2>Coupes / Calques</h2>
        <div id="layer-list">
          <!-- La liste des calques sera générée ici par JavaScript -->
        </div>
      </div>
    </div>

    <!-- Palette de couleurs -->
    <div id="color-palette" class="panel">
      <!-- Les couleurs seront générées ici par JavaScript -->
    </div>

    <!-- Scripts -->
    <script src="./renderer.js"></script>
  </body>
</html>
