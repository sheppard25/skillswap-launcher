<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>SpaceGravure</title>
    <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline';">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="main-container">
      <!-- Panneau de Gauche (Contrôles) -->
      <div class="left-panel panel">
        <h2>Contrôles</h2>

        <label for="width">Largeur (mm):</label>
        <input type="number" id="width" value="50">

        <label for="height">Hauteur (mm):</label>
        <input type="number" id="height" value="50">

        <label for="feedRate">Vitesse (mm/min):</label>
        <input type="number" id="feedRate" value="1000">

        <label for="laserPower">Puissance (S-value):</label>
        <input type="number" id="laserPower" value="1000">

        <button id="generate-btn">Générer & Prévisualiser</button>
        <button id="save-btn">Sauvegarder G-code</button>

        <hr>

        <h3>Résultat G-code:</h3>
        <textarea id="gcode-output" readonly></textarea>
      </div>

      <!-- Panneau Central (Zone de Travail) -->
      <div class="center-panel panel">
        <canvas id="preview-canvas" width="600" height="600"></canvas>
      </div>

      <!-- Panneau de Droite (Calques/Couches) -->
      <div class="right-panel panel">
        <h2>Coupes / Calques</h2>
        <p>(Fonctionnalité à venir...)</p>
      </div>
    </div>

    <!-- Scripts -->
    <script src="./renderer.js"></script>
  </body>
</html>
